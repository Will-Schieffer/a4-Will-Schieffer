<!doctype html>
<html lang='en'>
  <head>
    <title>Recipe Pinner</title>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <meta name='description' content='Save and organize recipes you want to come back to.' />

    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link rel='preconnect' href='https://cdn.jsdelivr.net'> 
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>

    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'>
    <link rel='stylesheet' href='css/main.css' />

    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />

    <script src='js/main.js' defer></script>
  </head>
  <body class='app-shell'>
    <header class='topbar'>
      <div class='container topbar-inner'>
        <span class='brand'>Will Schieffer's Recipe Pinner</span>
        <div class='topbar-actions'>
          <span id='username' class='username'></span>
          <a href='/logout' class='logout-link'>Log out</a>
        </div>
      </div>
    </header>

    <main class='container app-main'>
      <section class='form-section'>
        <h1 class='page-title'>Your recipes</h1>
        <p class='page-subtitle'>Save any recipes you want to come back to!</p>

        <form id='recipeForm' class='recipe-form'>
          <div class='row g-3'>
            <div class='col-md-6'>
              <label for='title' class='form-label'>Recipe name</label>
              <input id='title' class='form-control' placeholder='e.g. Scones' required>
            </div>

            <div class='col-md-6'>
              <label for='url' class='form-label'>Recipe URL</label>
              <input id='url' type='url' class='form-control' placeholder='https://example.com/recipe' required>
            </div>

            <div class='col-md-6'>
              <label for='category' class='form-label'>Category</label>
              <select id='category' class='form-select' required>
                <option value='Breakfast'>Breakfast</option>
                <option value='Lunch'>Lunch</option>
                <option value='Dinner'>Dinner</option>
                <option value='Snack'>Snack</option>
                <option value='Dessert'>Dessert</option>
                <option value='Other'>Other</option>
              </select>
            </div>

            <div class='col-md-6'>
              <span class='form-label d-block'>Difficulty</span>
              <div class='form-check form-check-inline'>
                <input class='form-check-input' type='radio' name='difficulty' id='difficultyEasy' value='Easy' checked>
                <label class='form-check-label' for='difficultyEasy'>Easy</label>
              </div>
              <div class='form-check form-check-inline'>
                <input class='form-check-input' type='radio' name='difficulty' id='difficultyMedium' value='Medium'>
                <label class='form-check-label' for='difficultyMedium'>Medium</label>
              </div>
              <div class='form-check form-check-inline'>
                <input class='form-check-input' type='radio' name='difficulty' id='difficultyHard' value='Hard'>
                <label class='form-check-label' for='difficultyHard'>Hard</label>
              </div>
            </div>

            <div class='col-12'>
              <label for='notes' class='form-label'>Notes</label>
              <textarea id='notes' class='form-control' rows='2' placeholder='Substitutions, tweaks, reminders...'></textarea>
            </div>

            <div class='col-12'>
              <div class='form-check'>
                <input class='form-check-input' type='checkbox' id='favorite'>
                <label class='form-check-label' for='favorite'>Mark as favorite</label>
              </div>
            </div>

            <div class='col-12'>
              <button id='submit' type='submit' class='btn btn-primary'>Save recipe</button>
            </div>
          </div>
        </form>
      </section>

      <section class='list-section'>
        <ul id='recipeList' class='recipe-list list-unstyled'></ul>
      </section>
    </main>
  </body>
</html>
